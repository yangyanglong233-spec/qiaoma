/* Physical numbering is from the seated player's right toward their left. */
.wall-bottom{flex-direction:row-reverse}.wall-left{flex-direction:column-reverse}
.wall-stack.head:after{content:'头'}.wall-stack.tail:after{content:'尾';color:#bddde2}
.wall-left .head:after,.wall-left .tail:after{left:-17px;top:-1px}
.wall-right .head:after,.wall-right .tail:after{right:-17px;top:-1px}

/* Minimal theme: neutral chrome, colour lives only on the tiles. */
:root{--paper:#f5f5f3;--ink:#1b1b1b;--muted:#8a8a86;--border:#e4e4e0;--white:#fff;--green:#1b1b1b;--gold:#1b1b1b;--edge:#cfcfc8}
body{background:var(--paper)}
button:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--ink)}
.topbar{background:#fff;border-bottom-color:var(--border)}
.brand-mark{background:var(--ink);color:#fff;box-shadow:none}
.brand small,.top-middle,.eyebrow{color:var(--muted)}
.live-dot{background:var(--ink)}.divider{background:var(--border)}
.ghost,.icon-button{color:#555}
.light-button{background:var(--ink);color:#fff}
.small-button{background:#fff;color:#444;border:1px solid var(--border)}
.mode-chip{border-color:var(--border);color:var(--muted)}

/* Table: three rows, opponents around a square field. */
.mahjong-table{height:auto;background:#ebebe8;box-shadow:none;border-radius:18px;color:var(--ink);overflow:visible;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto auto auto;align-items:center;gap:16px 18px;padding:22px 26px 24px}
.table-grain,.table-line,.wall-strip{display:none}
.seat{position:static;width:auto;min-width:0}
.north{grid-column:1/-1;grid-row:1;justify-self:center;text-align:center}
.west{grid-column:1;grid-row:2;justify-self:start}
.east{grid-column:3;grid-row:2;justify-self:end}
.south{grid-column:1/-1;grid-row:3}
.field{position:relative;inset:auto;grid-column:2;grid-row:2;--rw:26px;--rh:35px;--g:2px;--pad:8px;--W:calc(6*var(--rw) + 5*var(--g));--H:calc(4*var(--rh) + 3*var(--g));width:calc(2*var(--H) + var(--W) + 2*var(--pad));height:calc(2*var(--H) + var(--W) + 2*var(--pad))}
/* Each river is laid out as if in front of you, then turned to face its owner. */
.river{position:absolute;inset:auto;display:grid;grid-template-columns:repeat(6,var(--rw));grid-auto-rows:var(--rh);gap:var(--g);width:var(--W);height:var(--H);align-content:start;transform-origin:50% 50%}
.river-south{left:calc(var(--H) + var(--pad));top:calc(var(--H) + var(--W) + 2*var(--pad));transform:none}
.river-north{left:calc(var(--H) + var(--pad));top:0;transform:rotate(180deg)}
.river-west{left:calc(var(--H)/2 - var(--W)/2);top:calc(var(--H)/2 + var(--W)/2 + var(--pad));transform:rotate(90deg)}
.river-east{left:calc(1.5*var(--H) + var(--W)/2 + 2*var(--pad));top:calc(var(--H)/2 + var(--W)/2 + var(--pad));transform:rotate(-90deg)}

.table-center{left:calc(var(--H) + var(--pad));top:calc(var(--H) + var(--pad));width:var(--W);height:var(--W);transform:none;background:#fff;border:1px solid var(--border);box-shadow:none;border-radius:12px;padding:0 0 14px;justify-content:center}
.center-emblem{color:var(--ink)}.remaining{color:var(--muted)}.remaining b{color:var(--ink)}

/* Seats */

.seat-tag{background:#fff;color:var(--ink);border:1px solid var(--ink)}

/* Side seats see tiles from the side: rotate, and swap the layout box to match. */

.east .tile.meld{transform:rotate(-90deg)}

/* Tiles: the only coloured objects. */

/* Panels */

.action-button.danger{background:#fff;color:#666;border:1px dashed #b5b5b0}

.analysis-symbol{color:var(--ink)}.analysis-content p{color:var(--muted)}
.outline-button{border-color:var(--border);color:var(--ink)}
.analysis-foot{background:#fafaf8;border-top-color:var(--border);color:var(--muted)}
.score-row .score-avatar{background:#f1f1ee;color:#555}
.score-row.you{background:#f6f6f4;color:var(--ink)}
.score-row .score-number.pos{color:var(--ink);font-weight:600}.score-row .score-number.neg{color:var(--muted)}
.relations{color:var(--muted);border-top-color:var(--border)}
.log-entry{color:var(--muted)}.log-entry b{color:var(--ink)}.log-entry .log-point{background:#c8c8c3}
.analysis-table th{color:var(--muted);border-bottom-color:var(--border)}.analysis-table td{border-bottom-color:#efefec}
.analysis-table tr.best td{color:var(--ink);font-weight:600}
.wait-pill{background:#f1f1ee;color:var(--ink)}
.analysis-title button,.reveal-control{color:var(--muted)}
.toast{background:var(--ink);color:#fff;border-color:var(--ink)}
dialog{background:#fff;border-color:var(--border)}dialog::backdrop{background:#0000004d;backdrop-filter:none}
.modal-copy{color:#555}.modal-copy h3{color:var(--ink)}
.wall-map-stack{background:#f1f1ee}.wall-map-tile{background:#d3d3ce;color:#444}
.wall-map-tile.head{background:var(--ink);color:#fff}.wall-map-tile.tail{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wall-map-caption,.wall-legend{color:var(--muted)}
.setting-row{border-bottom-color:var(--border)}.setting-row input[type=text]{border-color:var(--border);background:#fff}
.result-title{color:var(--ink)}.result-line{border-bottom-color:var(--border)}.result-tags{color:var(--muted)}



.south .seat-body{justify-content:center;align-items:flex-end;gap:16px;margin-top:14px}

/* Knock shout */
.mahjong-table{position:relative}
.shout{position:absolute;left:0;top:0;z-index:30;pointer-events:none;will-change:transform,opacity}
.shout-body{position:relative;transform:translate(-50%,-42px);display:flex;flex-direction:column;align-items:center;gap:10px}
.shout-seal{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Songti SC','STSong','Noto Serif CJK SC',serif;font-weight:700;font-size:50px;line-height:1;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--ink),0 14px 32px #00000047}
.shout-seal:before,.shout-seal:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ink);animation:shout-ring .9s ease-out .2s both}
.shout-seal:after{animation-delay:.45s}
.shout-lines{position:absolute;left:50%;top:42px;width:190px;height:64px;transform-origin:100% 50%;transform:translate(-100%,-50%) rotate(var(--a));background:repeating-linear-gradient(to bottom,transparent 0 8px,var(--ink) 8px 10px);-webkit-mask:linear-gradient(to left,#000 20%,transparent);mask:linear-gradient(to left,#000 20%,transparent);animation:shout-lines .7s ease-out both}
.shout-text{position:relative;z-index:1;background:#fff;color:var(--ink);font-size:13px;font-weight:600;letter-spacing:2px;padding:6px 13px;border-radius:999px;border:1px solid var(--ink);white-space:nowrap;box-shadow:0 6px 18px #0000001f}
@keyframes shout-ring{from{transform:scale(1);opacity:.75}to{transform:scale(2.4);opacity:0}}
@keyframes shout-lines{0%{opacity:0;clip-path:inset(0 0 0 100%)}35%{opacity:.9;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
.shout-flash .avatar{animation:seat-flash .9s ease-out 2}
@keyframes seat-flash{0%{box-shadow:0 0 0 0 #1b1b1b99}100%{box-shadow:0 0 0 16px #1b1b1b00}}

@media(prefers-reduced-motion:reduce){.shout-seal:before,.shout-seal:after,.shout-lines{animation:none!important;opacity:0}.shout-flash .avatar{animation:none}}

/* 补花 animation */
.fx-tile{position:fixed;z-index:60;pointer-events:none;margin:0;padding:2px}
.fx-back{position:fixed;z-index:59;pointer-events:none;border-radius:4px;background:linear-gradient(180deg,#3d7c63,#2b604c);border:1px solid #234f3e;box-shadow:0 4px 10px #00000033}
.fx-back span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;line-height:1;background:var(--ink);color:#fff;padding:3px 5px;border-radius:3px;white-space:nowrap}
.tile.fx-pop{animation:fx-pop .38s cubic-bezier(.3,.7,.2,1) backwards}
@keyframes fx-pop{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}

/* Online play */

/* ===================== Responsive 3D table ===================== */
:root{--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
 --top-h:46px;--side-pad:16px;--bottom-gap:18px;--tw:44px;--panel-w:240px;--id-w:120px;--hand-h:80px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body.p3d{background:var(--paper);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.p3d #stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--safe-t) var(--safe-r) 0 var(--safe-l);background:var(--paper);overflow:hidden}

/* top bar */
body.p3d .topbar{flex:none;height:var(--top-h);padding:0 var(--side-pad);gap:12px;min-width:0}
body.p3d .brand{gap:9px;flex:none}body.p3d .brand-mark{width:28px;height:28px;font-size:17px;border-radius:7px}
body.p3d .brand strong{font-size:14px;letter-spacing:2px}body.p3d .brand small{display:none}

body.p3d .small-button{padding:5px 9px;font-size:11px}
body.p3d .topbar nav{gap:2px;flex:none}body.p3d .ghost{padding:7px 9px;font-size:12px}
body.p3d .icon-button{font-size:17px;padding:4px 8px}body.p3d .light-button{padding:7px 12px;font-size:12px;border-radius:7px;gap:8px}
#drawer-button.on{background:var(--ink);color:#fff;border-radius:6px}
.sound-button{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

/* the playing area */
body.p3d .workspace{flex:1;position:relative;min-height:0;max-width:none;margin:0;padding:0;display:block;height:auto}
body.p3d .game-column{position:absolute;inset:0}
body.p3d .mahjong-table{position:absolute;inset:0;display:flex;flex-direction:column;height:auto;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;overflow:hidden;
 background:radial-gradient(120% 90% at 50% 78%,#f6f5f1 0%,#ecebe6 60%,#e4e3dd 100%)}
body.p3d .table-grain,body.p3d .table-line{display:none}
body.p3d .scene{position:relative;flex:1;min-height:0;align-self:stretch;width:100%}
body.p3d .mahjong-table{align-items:stretch;justify-content:flex-start}

/* 3D table: laid out flat, then tipped back. JS scales .plane-fit to the space. */
body.p3d .plane-fit{position:absolute;left:50%;top:0;transform-origin:50% 0;will-change:transform}
body.p3d .plane{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto 10px;gap:14px 16px;align-items:center;justify-items:center;
 padding:20px 26px 14px;border-radius:28px;background:linear-gradient(180deg,#e3e2dc,#eeede8);box-shadow:inset 0 0 0 1px #0000000f,0 40px 50px -34px #00000040;
 transform:perspective(var(--persp,1150px)) rotateX(var(--tilt,31deg));transform-origin:50% 100%}
body.p3d .plane .north{grid-column:2;grid-row:1}
body.p3d .plane .west{grid-column:1;grid-row:2}
body.p3d .plane .field{grid-column:2;grid-row:2}
body.p3d .plane .east{grid-column:3;grid-row:2}
body.p3d .plane .seat{position:static;inset:auto;transform:none;margin:0}
body.p3d .plane .player-head,body.p3d .plane .flowers-row{display:none}
body.p3d .plane .seat-body{margin:0}
body.p3d .plane .back-tile{width:22px;height:32px}
body.p3d .plane .back-tile:after{margin:5px 4px;height:20px}

body.p3d .plane .west .back-tile:after,body.p3d .plane .east .back-tile:after{margin:4px 5px;height:11px}

body.p3d .plane .meld-caption{display:none}body.p3d .plane .meld-group{padding-bottom:0}
body.p3d .plane .revealed-hand .tile{width:27px;height:37px}

/* field: N/S rivers 10×3, W/E rivers 6×4, around a wide centre */
body.p3d .field{position:relative;--rw:31px;--rh:42px;--g:2px;--pad:8px;
 --Wn:calc(10*var(--rw) + 9*var(--g));--Hn:calc(3*var(--rh) + 2*var(--g));
 --We:calc(6*var(--rw) + 5*var(--g));--He:calc(4*var(--rh) + 3*var(--g));
 width:calc(var(--Wn) + 2*var(--He) + 2*var(--pad));height:calc(var(--We) + 2*var(--Hn) + 2*var(--pad));margin:0}
body.p3d .river{grid-template-columns:repeat(10,var(--rw));width:var(--Wn);height:var(--Hn)}
body.p3d .river-west,body.p3d .river-east{grid-template-columns:repeat(6,var(--rw));width:var(--We);height:var(--He)}
body.p3d .river-south{left:calc(var(--He) + var(--pad));top:calc(var(--Hn) + var(--We) + 2*var(--pad))}
body.p3d .river-north{left:calc(var(--He) + var(--pad));top:0}
body.p3d .river-west{left:calc(var(--He)/2 - var(--We)/2);top:calc(var(--Hn) + var(--pad) + var(--We)/2 - var(--He)/2)}
body.p3d .river-east{left:calc(1.5*var(--He) + var(--Wn) + 2*var(--pad) - var(--We)/2);top:calc(var(--Hn) + var(--pad) + var(--We)/2 - var(--He)/2)}
body.p3d .table-center{left:calc(var(--He) + var(--pad));top:calc(var(--Hn) + var(--pad));width:var(--Wn);height:var(--We);padding:0;gap:3px;border-radius:14px}
body.p3d .center-emblem{font-size:30px;line-height:32px}
body.p3d .remaining{font-size:12px}body.p3d .remaining b{font-size:26px}
body.p3d .compass{grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,20px);font-size:13px}
body.p3d .last-event{font-size:11px;max-width:80%}
body.p3d .next-button{font-size:13px}

/* opponents' badges: flat, always legible */
.hud{position:absolute;inset:0;pointer-events:none;z-index:6}
.hud-badge{position:absolute;top:8px;display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;border-radius:999px;background:#ffffffeb;
 box-shadow:0 1px 0 #00000008,0 4px 14px #00000014;font-size:12px;white-space:nowrap;transition:box-shadow .2s}
.hud-badge.turn{box-shadow:0 0 0 2px var(--ink),0 6px 16px #00000024}
.hud-north{left:50%;transform:translateX(-50%)}.hud-west{left:var(--side-pad)}.hud-east{right:var(--side-pad)}
.hud-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f1f0eb;font-size:13px;flex:none}
.hud-badge.turn .hud-avatar{background:var(--ink);color:#fff}
.hud-line{display:flex;align-items:baseline;gap:6px}.hud-name{font-weight:600;color:var(--ink)}
.hud-score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}.hud-score.pos{color:var(--ink);font-weight:600}
.hud-chips{display:flex;gap:4px;margin-top:2px}
.chip{font-size:10px;line-height:15px;padding:0 6px;border-radius:999px;background:#efeee9;color:#55554f}
.chip.qiao{background:var(--ink);color:#fff}.chip.tian{background:#9a7a2c;color:#fff}.chip.pen{background:#fff;color:#8a3b30;box-shadow:inset 0 0 0 1px #8a3b3066}
.chip.dealer{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.chip.human{background:#e7eee9;color:#2f5f4a}

/* your seat: flat, in front of the table */
body.p3d .south{flex:none;position:relative;inset:auto;transform:none;width:auto;z-index:4;display:flex;align-items:flex-end;gap:14px;margin:0;
 padding:6px calc(var(--panel-w) + var(--side-pad) + 14px) calc(var(--bottom-gap) + var(--safe-b)) calc(var(--side-pad))}
body.p3d .south .player-head{flex:none;width:var(--id-w);display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin:0}
body.p3d .south .human-meta{gap:4px}body.p3d .south .flower-chip{display:none}
body.p3d .south .flowers-row{flex-wrap:wrap;margin:0;gap:2px}body.p3d .south .flower-label{font-size:10px;white-space:nowrap}
body.p3d .south .tile.mini{width:13px;height:18px}
body.p3d .south .seat-body{flex:1;min-width:0;margin:0;display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:calc(var(--tw)*.35)}
body.p3d .south .hand-row{display:flex;flex-wrap:nowrap;gap:calc(var(--tw)*.06);margin:0;min-height:0}
body.p3d .south .hand-row .tile{width:var(--tw);height:calc(var(--tw)*1.38);padding:calc(var(--tw)*.05);border-radius:calc(var(--tw)*.11);flex:none}
body.p3d .south .hand-row .tile.drawn{margin-left:calc(var(--tw)*.3)}
body.p3d .south .hand-row .tile.selected{transform:translateY(calc(var(--tw)*-.28))}
body.p3d .south .melds-row{display:flex;flex-wrap:nowrap;gap:calc(var(--tw)*.14);margin:0}
body.p3d .south .tile.meld{width:calc(var(--tw)*.68);height:calc(var(--tw)*.94);border-radius:calc(var(--tw)*.08)}
body.p3d .south .meld-group{padding-bottom:12px}

/* actions: beside the hand when there is room, above it otherwise */
body.p3d .decision-bar{position:absolute;z-index:8;right:var(--side-pad);bottom:calc(var(--bottom-gap) + var(--safe-b));width:var(--panel-w);
 margin:0;min-height:0;padding:10px 12px;flex-direction:column;align-items:stretch;gap:8px;border-radius:12px;background:#fff;box-shadow:0 8px 24px #0000001c}
body.p3d .decision-copy{gap:8px;align-items:flex-start}
body.p3d .decision-copy strong{font-size:13px;display:block}
body.p3d .decision-copy span:not(.status-dot){font-size:11px;line-height:1.4;display:block;margin-top:2px}
body.p3d .action-buttons{justify-content:flex-end;gap:6px;flex-wrap:wrap}
body.p3d .action-button{padding:9px 13px;font-size:13px;border-radius:7px}

body.p3d.stack .decision-bar{bottom:calc(var(--bottom-gap) + var(--safe-b) + var(--hand-h) + 10px);width:auto;max-width:min(360px,calc(100vw - 2*var(--side-pad)))}

function tile(id,g,classes='',attrs=''){return `<button type="button" class="tile ${classes}" aria-label="${esc(MJ.LABELS[g.t(id)])}" title="${esc(MJ.LABELS[g.t(id)])}" ${attrs}>${tileSvg(g.t(id))}</button>`;}
function current(){return review===null?game:MJ.Game.restore({state:structuredClone(game.history[review].state),history:[]});}
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
function save(){if(IS_GUEST)return;Net.push();try{localStorage.setItem('qiaoma.table.v1',JSON.stringify({state:game.s,history:game.history,seed,fixedSeed,delay,archives}));$('save-status').textContent='已自动保存于本机';storageOK=true;}catch{$('save-status').textContent='本机存储不可用，请导出牌谱';storageOK=false;}}
function pretty(n){return n>0?'+'+n:n.toString();}
function openModal(title,body){$('modal-title').textContent=title;$('modal-body').innerHTML=body;if(!$('modal').open)$('modal').showModal();}

// At the end of a hand: the winner's tiles end with the winning tile, marked. For 捉铳/抢杠 that tile is
// shown here as well as (marked) where it came from.
function winLayout(seat,g,ids){const r=g.s.result;if(!r||!r.winners.includes(seat)||r.winId==null)return {ids,win:null};
 return {ids:ids.filter(id=>id!==r.winId),win:r.winId};}
function renderSeat(seat,g){let s=g.s,p=s.players[seat],isYou=seat===me,turn=s.actor===seat&&!s.result,show=isYou||!!s.result||(review!==null&&revealed&&!!game.s.result),tags=`${s.dealer===seat?'<span class="seat-tag">庄</span>':''}${p.qiao?`<span class="seat-tag qiao">${p.tian?'天敲':'已敲'}</span>`:''}${p.passedWin||p.passedKong?'<span class="seat-tag penalty">停胡</span>':''}`;
 const flowers=`<div class="flowers-row"><span class="flower-label">${p.flowers.length?p.flowers.length+' 花':'无亮花'}</span>${p.flowers.map(id=>tile(id,g,'mini','tabindex="-1"')).join('')}</div>`;
 const melds=`<div class="melds-row">${p.melds.map(m=>`<div class="meld-group">${m.ids.map(id=>tile(id,g,'meld','tabindex="-1"')).join('')}<span class="meld-caption">${{chi:'吃',pon:'碰',daiminkan:'明杠',ankan:'暗杠',kakan:'上杠'}[m.kind]}${m.from!==seat?' · '+SEATNAME[m.from]:''}</span></div>`).join('')}</div>`;
 let identity=`<span class="avatar ${isYou?'you':''}">${isYou?'我':esc(NAMES[seat][0])}</span><div><div class="player-name">${esc(seatName(seat))}<span class="seat-score ${s.scores[seat]>0?'pos':''}">${pretty(s.scores[seat])}</span> ${tags}</div><div class="player-role">${esc(ROLES[seat])}</div></div>`;
 let html;if(isYou){let legal=review===null&&!s.result?g.actions(me):[],allowed=new Set(legal.filter(a=>a.kind===(armed?'qiao':'discard')).map(a=>a.id));let sorted=p.hand.slice().sort((a,b)=>g.t(a)-g.t(b)||a-b);if(s.actor===me&&s.phase==='turn'&&s.drawn!==null&&p.hand.includes(s.drawn)){sorted=sorted.filter(id=>id!==s.drawn);sorted.push(s.drawn);}const myWin=winLayout(me,g,sorted);sorted=myWin.ids;
 html=`<div class="player-head"><div class="identity">${identity}</div><div class="human-meta">${flowers}<span class="flower-chip">${p.open?'已开门':'未开门'}</span></div></div><div class="seat-body"><div class="hand-row">${sorted.map(id=>tile(id,g,`${allowed.has(id)?'playable':''} ${selected===id?'selected':''} ${s.phase==='turn'&&s.actor===me&&id===s.drawn?'drawn':''} ${armed&&!allowed.has(id)?'dim':''} ${analyze&&analysisRows[0]?.t===g.t(id)?'recommended':''}`,`data-tile="${id}" ${allowed.has(id)?'':'aria-disabled="true"'}`)).join('')}${myWin.win!=null?tile(myWin.win,g,'win-tile','tabindex="-1" aria-label="胡牌"'):''}</div>${melds}</div>`;
 }else{const ow=winLayout(seat,g,p.hand.slice().sort((a,b)=>g.t(a)-g.t(b)));let hand=show?`<div class="revealed-hand">${ow.ids.map(id=>tile(id,g,'meld','tabindex="-1"')).join('')}${ow.win!=null?tile(ow.win,g,'meld win-tile','tabindex="-1" aria-label="胡牌"'):''}</div>`:`<div class="hand-backs" aria-label="${p.hand.length}张隐藏手牌">${p.hand.map(()=>'<span class="back-tile"></span>').join('')}</div>`;html=`<div class="player-head">${identity}</div><div class="seat-body">${hand}${melds}</div>${flowers}`;}
 let el=$(POS[seat]+'-seat');el.innerHTML=html;el.classList.toggle('active-seat',turn);
 const river=$('river-'+POS[seat]);river.innerHTML=`<span class="river-label">${SEATNAME[seat]}牌河</span>${p.river.map(r=>tile(r.id,g,`small ${r.claimed?'discarded':''} ${s.lastDiscard?.id===r.id&&!r.claimed?'last':''} ${s.result&&s.result.mode!=='self'&&s.result.winId===r.id?'win-source':''} ${r.qiao?'qiao-discard':''}`,'tabindex="-1"')).join('')}`;
}
function wallMarkers(g){const w=g.s.wall;let head=w.available[0],tail=null;if(w.available.length){let last=w.tiles[w.available.at(-1)],prev=w.tiles[w.available.at(-2)];tail=prev&&prev.seat===last.seat&&prev.stack===last.stack?prev.id:last.id;}return {head,tail};}
function renderWall(g){let w=g.s.wall,{head,tail}=wallMarkers(g),set=new Set(w.available);for(const [seat,pos] of [0,1,2,3].map(x=>[x,['bottom','right','top','left'][rel(x)]])){let stacks=[];for(let n=0;n<18;n++){let ids=w.tiles.filter(t=>t.seat===seat&&t.stack===n).map(t=>t.id),left=ids.filter(id=>set.has(id)).length;stacks.push(`<span class="wall-stack ${left===0?'empty':left===1?'half':''} ${ids.includes(head)?'head':''} ${ids.includes(tail)?'tail':''}" title="${SEATNAME[seat]}墙第${n+1}墩 · ${left}张${ids.includes(head)?' · 牌头':''}${ids.includes(tail)?' · 牌尾':''}"></span>`);}$( 'wall-'+pos).innerHTML=stacks.join('');}}
function act(a){if(IS_GUEST){Net.send({type:'act',a,serial:game.s.serial});if(game.s.phase==='response')guestPicked=game.s.serial;selected=null;armed=false;analysisSerial='';render();return;}if(review!==null)return;humanAct(a,0);}
// Host only. Responses to a discard are collected from every human who can respond before the engine resolves them.
let picks={key:-1,by:{}},guestPicked=-1;
function humanSeats(){return Net.guestOnline?[0,GUEST_SEAT]:[0];}
function picked(seat){return picks.key===game.s.serial&&picks.by[seat]!==undefined;}
function humanAct(a,seat){try{const s=game.s;if(s.result)return;if(!game.actions(seat).some(x=>JSON.stringify(x)===JSON.stringify(a)))throw new Error('非法动作');if(s.phase==='response'){if(picks.key!==s.serial)picks={key:s.serial,by:{}};picks.by[seat]=a;}else game.act(a,seat);if(seat===0){selected=null;armed=false;}analysisSerial='';save();render();schedule(s.phase==='response'?50:undefined);}catch(e){if(seat===0)fail(e);else{console.warn(e);Net.push();}}}
function renderActions(g){const s=g.s,container=$('actions');let actions=review===null?g.actions(me):[];const button=(label,a,cls='')=>`<button class="action-button ${cls}" data-action="${esc(JSON.stringify(a))}">${label}</button>`;
 let title=s.actor!==me&&!s.result&&s.phase!=='response'?`等待${seatName(s.actor)}`:'等待其他玩家',subtitle=Net.guestOnline||IS_GUEST?'两位真人对坐 · 上下家为 Bot':'对手仅依据自己的手牌与公开信息决策',html='';
 if(review!==null){title='复盘 · '+game.history[review].label;if(game.s.result){subtitle='公平分析使用当时信息；可切换查看四家手牌';html='<button class="action-button" id="reveal-toggle">'+(revealed?'隐藏对手牌':'查看四家手牌')+'</button>';}else{subtitle='本局进行中：只显示你当时能看到的信息';html='';}}
 else if(s.result){title=s.result.winners.length?'本局结束':'本局流局';subtitle=IS_GUEST?'任意一方都可以开始下一局':'点击复盘回看判断，或开始下一局';html='<button class="action-button" id="result-button">结算详情</button><button class="action-button primary" id="next-inline">下一局 →</button>';}
 else if(paused){title='牌桌已暂停';subtitle='点击继续，Bot 才会行动';html='<button class="action-button primary" id="resume-inline">继续牌局</button>';}
 else if(actions.some(a=>a.kind!=='pass'&&a.kind!=='start')){
 if(s.phase==='opening'||s.phase==='predraw'){title=s.phase==='predraw'?'首次摸牌前 · 可以天敲':'起手决策';subtitle='首次摸牌前可声明天敲；起手暗杠不影响天敲';for(const a of actions)html+=button(a.kind==='tian'?'天敲':a.kind==='start'?'继续':a.kind==='draw'?'直接摸牌':`暗杠 ${MJ.LABELS[a.t]}`,a,a.kind==='tian'?'gold':'');}
 else if(s.phase==='response'&&(IS_GUEST?guestPicked===s.serial:picked(me))){title='已选择';subtitle='等待其他玩家响应…';}
 else if(s.phase==='response'){title=actions.some(a=>a.kind==='win')?'可以胡牌':`可响应 ${MJ.LABELS[g.t(s.response.id)]}`;subtitle=s.response.mode==='rob'?'上杠可抢；合法胡必须胡':'先胡，再碰杠，最后吃';if(s.players[me].qiao&&actions.some(a=>a.kind==='daiminkan'))subtitle=g.kongFree(s.players[me])?'无花开门：可以不杠，过不受罚':'敲后合法杠必须杠；过则整局不能胡';for(const a of actions){let label={win:'胡',pass:'过',passwin:'过胡',pon:'碰',daiminkan:'明杠'}[a.kind]||`吃 ${a.need?.map(t=>MJ.LABELS[t]).join('·')}`;html+=button(label,a,a.kind==='win'?'gold':a.kind==='passwin'?'danger':'');}}

function showRules(){openModal('本桌规则',`<div class="modal-copy"><h3>敲与胡</h3><p>四面子一将，不采用七对、十三幺。必须提前敲，无天胡。平胡两摸三铳，不含底花；有牌型番不限门槛。无花算含底十花，花不足和死听也可敲。</p><h3>敲后杠与处罚</h3><p>敲后杠须不改牌型：杠后剩余手牌仍须听牌，且听口与敲时完全相同。未开门只能且必须暗杠；开门有合法杠必须杠，但无花开门时明杠、暗杠都可以不杠，不受罚（杠即有花，会失去无花底分）。胡优先杠。过胡或过杠整局不能胡，但仍须合法必杠。暗杠公开牌种，不算开门。</p><h3>计分与三口</h3><p>混碰两番、清碰三番，门清、天敲、杠开、大吊车各一番可叠加。普通奖励花加一底花。每番乘二，苍蝇先加再乘抢杠三倍。</p><p>同一方从同一人取得三口即双向包牌，可有多个包家。自摸每个包家给三家；捉铳放铳者给一家、每个包家再给一家。普通平胡也包。一炮多响不分摊、共享苍蝇。</p><h3>吃碰与牌墙</h3><p>补花：庄家开局先补；其余各家起手花留在手中，轮到自己摸牌或吃碰杠时才补，均从牌尾补；上家出牌时，起手花未补的下家先补花，再决定吃不吃。轮到摸牌时先补花，可天敲，再从牌头摸牌；吃碰后先补花再出牌；明杠先补花再杠后补牌。</p><p>吃后无同张或替代端点禁打。可碰未碰，本次牌序不能再碰同种；自己正常摸牌或其他吃碰杠后完成舍牌可解除。墙空最后弃牌只处理胡，无人胡流局。无补牌仍须必杠，杠后无人抢则流局。</p><h3>当前实现</h3><p>使用已确认桌规与资料基本基线。单次掷骰开口、每花 10 分及首庄由你担任为当前练习预设。Bot 以牌效为主，并按手牌倾向做混一色、清一色或碰碰胡；有人敲后按公开信息判断安全牌，离听越远越倾向防守。尚未实现抽样模拟。完整来源及确认记录见同目录 RULES.md、WALL.md。</p></div>`);}
function settings(){openModal('牌桌设置',`<div class="setting-row"><label for="bot-speed">Bot 行动间隔</label><input id="bot-speed" type="range" min="100" max="1400" step="100" value="${delay}"><span id="speed-value">${delay} ms</span></div><div class="setting-row"><label for="new-seed">新牌桌种子</label><input id="new-seed" type="text" maxlength="64" value="" placeholder="留空即随机发牌"></div><div class="setting-row"><span>本局种子</span><span class="seed-current" title="填进上面的框可以复现这一局">${esc(game.s.seed)}</span></div><div class="setting-row"><span>存档与牌谱</span><button id="import-button" class="small-button">导入 JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>${archives.length?`<div class="setting-row"><label for="archive-select">历史牌局 / 分支</label><select id="archive-select">${archives.map((a,i)=>`<option value="${i}">${esc(a.label)}</option>`).join('')}</select><button id="archive-open" class="small-button">打开复盘</button></div>`:''}<p class="modal-copy">种子可复现发牌。更改种子并开新桌会重置积分；当前桌规不封顶。Bot 速度仅影响等待，不影响牌墙。</p><div class="modal-buttons"><button id="settings-save" class="action-button">保存设置</button><button id="settings-new" class="action-button primary">用此种子开新桌</button></div>`);}
function chooseTile(id){let a=game.actions(me).find(a=>a.id===id&&a.kind===(armed?'qiao':'discard'));if(!a||paused||review!==null)return;if(selected===id){confirmDiscard();return;}selected=id;SFX.play('tick');render();}
function confirmDiscard(){let a=game.actions(me).find(a=>a.id===selected&&a.kind===(armed?'qiao':'discard'));if(a)act(a);}
function exportGame(){const blob=new Blob([JSON.stringify({format:'qiaoma-local-v1',state:game.s,history:game.history,seed,delay,archives},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`敲麻-第${game.s.round}局-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);notify('牌谱已导出，可在设置中导入恢复');}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const id=el.id;
 if(el.dataset.action){let a=JSON.parse(el.dataset.action);if(['passwin','passkong'].includes(a.kind)||a.kind==='pass'&&game.s.players[me].qiao&&game.actions(me).some(x=>x.kind==='daiminkan')){if(!confirm('放过后本局不能再胡，但仍须执行后续合法杠。确定放过？'))return;}act(a);return;}
 if(el.dataset.tile!==undefined){chooseTile(+el.dataset.tile);return;}
 if(el.dataset.selectType!==undefined){let tid=game.s.players[me].hand.find(x=>game.t(x)===+el.dataset.selectType);if(tid!==undefined)chooseTile(tid);return;}
 const handlers={
 'arm-qiao':()=>{armed=!armed;selected=null;render();},'discard-confirm':confirmDiscard,
 'pause-button':()=>{paused=!paused;render();schedule();},'resume-inline':()=>{paused=false;render();schedule();},
 'analyze-button':()=>{analyze=true;analysisSerial='';render();},'analysis-hide':()=>{analyze=false;render();},
 'replay-button':replay,'modal-replay':replay,'wall-button':showWall,'rules-button':showRules,'settings-button':settings,
 'new-button':()=>{if(game.s.result||confirm('开启新牌桌将重置积分和当前牌局。需要保留时请先导出牌谱。'))newTable();},
 'next-button':nextRound,'next-inline':nextRound,'modal-next':nextRound,
 'modal-close':()=>{if(IS_GUEST&&!game&&$('modal-title').textContent==='加入牌桌')return Net.go?.();$('modal').close();},'result-button':()=>resultModal(game),
 'result-reveal':()=>{revealed=true;$('modal').close();render();},'reveal-toggle':()=>{if(!game.s.result){notify('本局结束后才能查看四家手牌');return;}revealed=!revealed;render();},
 'replay-prev':()=>{review=Math.max(0,review-1);analysisSerial='';render();},'replay-next':()=>{review=Math.min(game.history.length-1,review+1);analysisSerial='';render();},
 'replay-exit':()=>{review=null;revealed=false;paused=false;analysisSerial='';render();schedule();},
 'branch-button':()=>{if(review===null)return;if(!game.s.result){notify('本局结束后才能从复盘节点开分支');return;}if(Net.guestOnline){notify('联机时不能开分支');return;}archives.push({label:`第 ${game.s.round} 局 · 分支前原牌谱`,state:structuredClone(game.s),history:game.history.slice()});let history=game.history.slice(0,review+1);game=MJ.Game.restore({state:structuredClone(history.at(-1).state),history});review=null;revealed=false;paused=false;analysisSerial='';lastResultSerial=-1;save();render();schedule();notify('已建立新分支，使用该节点剩余牌墙继续');},
 'archive-open':()=>{let a=archives[+$('archive-select').value];if(!a)return;archives.push({label:`第 ${game.s.round} 局 · 切换前`,state:structuredClone(game.s),history:game.history.slice()});game=MJ.Game.restore({state:structuredClone(a.state),history:a.history.slice()});save();replay();},
 'export-button':()=>{if(!game.s.result){notify('本局结束后才能导出牌谱');return;}exportGame();},'import-button':()=>$('import-file').click(),
 'settings-save':()=>{delay=+$('bot-speed').value;$('modal').close();save();schedule();notify('已保存 Bot 行动间隔');},
 'invite-button':()=>Net.invite(),'sound-button':()=>SFX.cycle(),'drawer-button':()=>{document.body.classList.toggle('drawer');el.classList.toggle('on',document.body.classList.contains('drawer'));},'invite-copy':()=>Net.copy(),'room-close':()=>{Net.close();$('modal').close();notify('房间已关闭');},'join-go':()=>Net.go?.(),
 'settings-new':()=>{delay=+$('bot-speed').value;newTable($('new-seed').value.trim()||undefined);}
 };handlers[id]?.();});
document.addEventListener('dblclick',e=>{let el=e.target.closest('[data-tile]');if(el){chooseTile(+el.dataset.tile);confirmDiscard();}});
document.addEventListener('keydown',e=>{if(e.target.id==='join-name'&&e.key==='Enter'){Net.go?.();return;}if($('modal').open)return;if(e.key==='Enter'&&selected!==null){e.preventDefault();confirmDiscard();}if(e.key==='Escape'&&armed){armed=false;selected=null;render();}});
document.addEventListener('input',e=>{if(e.target.id==='replay-slider'){review=+e.target.value;analysisSerial='';render();}if(e.target.id==='bot-speed')$('speed-value').textContent=e.target.value+' ms';});
document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;let file=e.target.files[0];if(!file)return;try{if(file.size>8*1024*1024)throw new Error('牌谱超过 8MB');let data=JSON.parse(await file.text());if(data.state?.version!==MJ.RULE_VERSION||data.state?.wall?.tiles?.length!==144||data.state.players?.length!==4||!Array.isArray(data.history))throw new Error('不是兼容版本的牌谱');let restored=MJ.Game.restore(data);clearTimeout(timer);game=restored;archives=data.archives||[];seed=data.seed||game.s.seed;delay=data.delay||600;selected=null;armed=false;paused=false;review=null;revealed=false;analysisSerial='';lastResultSerial=-1;$('modal').close();save();render();schedule();notify('已恢复牌谱');}catch(err){notify('无法导入：'+err.message);}});
if(IS_GUEST){Net.join(ROOM);}else{
try{let raw=localStorage.getItem('qiaoma.table.v1');if(raw){let data=JSON.parse(raw);const legacy=String(data.seed||data.state?.seed||'').startsWith('上海·练习001');if(['qiaoma-tournament-v1.77',MJ.RULE_VERSION].includes(data.state?.version)&&!legacy){data.state.version=MJ.RULE_VERSION;game=MJ.Game.restore(data);archives=data.archives||[];seed=data.seed||seed;fixedSeed=!!data.fixedSeed;delay=data.delay||delay;}}}catch{storageOK=false;}
// Every visit deals a fresh random table; a game already in progress is kept in the archive list.
let resumed=false;const hosting=localStorage.getItem('qiaoma.room');if(game&&hosting&&!game.s.result){/* host reloaded mid-game: keep the table */}else if(game){if(game.history.length>1){archives=archives.filter(a=>!a.resume);archives.push({label:`上次牌桌 · 第 ${game.s.round} 局${game.s.result?' · 已结束':' · 未完成'}`,state:game.s,history:game.history,resume:true});resumed=true;}game=null;seed=freshSeed();}
if(!game)game=new MJ.Game(seed,0);save();render();schedule();if(resumed)notify('已随机开新桌 · 上次牌局可在 ⚙ 设置中恢复');
if(localStorage.getItem('qiaoma.room'))Net.host(localStorage.getItem('qiaoma.room'));}
// Exposed for reproducible local QA; Bot still only receives observe()/legal actions.
SFX.paint();window.layoutTable?.();
window.qiaoma={get SFX(){return SFX},get game(){return game},pause:()=>{paused=true;clearTimeout(timer);render();},newTable,render,tileSvg};
